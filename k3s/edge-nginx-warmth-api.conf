# DOCUMENTATION COPY — the live file is on the Timeweb edge box (81.200.154.252)
# at /etc/nginx/sites-available/warmth-api (symlinked into sites-enabled/).
# This is NOT applied by kubectl; if the edge box is rebuilt, restore this by
# hand and `nginx -t && systemctl reload nginx`.
#
# Traffic flow: client -> this edge (TLS terminate) -> Hetzner k3s (167.235.148.148:443)
# for the API, EXCEPT /images/activities/* which is proxied to the in-cluster
# warmth-media service (see k3s/35-media.yaml). The edge box is itself a k3s node,
# so it reaches the media ClusterIP via kube-proxy (NodePorts do not bind on the
# hosts here). If the warmth-media Service is recreated its ClusterIP changes —
# update the proxy_pass line below to match `kubectl -n warmth get svc warmth-media`.

upstream warmth_poland {
    server 167.235.148.148:443;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=couple_join:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name warmth-api.dbtvault-solutions.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warmth-api.dbtvault-solutions.tech;

    ssl_certificate /etc/letsencrypt/live/warmth-api.dbtvault-solutions.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warmth-api.dbtvault-solutions.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Activity card art (images + looping videos) served from the Longhorn-backed
    # warmth-media pod, not the API. ^~ so it wins over the catch-all `location /`.
    location ^~ /images/activities/ {
        proxy_pass http://10.43.244.213;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /couple/join {
        limit_req zone=couple_join burst=5 nodelay;
        proxy_pass https://warmth_poland;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name warmth-api.dbtvault-solutions.tech;
        proxy_set_header Host warmth-api.dbtvault-solutions.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass https://warmth_poland;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name warmth-api.dbtvault-solutions.tech;
        proxy_set_header Host warmth-api.dbtvault-solutions.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
