# DOCUMENTATION COPY — the live file is on the Timeweb edge box (81.200.154.252)
# at /etc/nginx/sites-available/warmth-api (symlinked into sites-enabled/).
# This is NOT applied by kubectl; if the edge box is rebuilt, restore this by
# hand and `nginx -t && systemctl reload nginx`.
#
# warmth-api.dbtvault-solutions.tech has TWO A records (this box + monthly-coral),
# so DNS round-robins across two independent edges. This edge proxies to the
# warmth-api Service ClusterIP (via kube-proxy, load-balanced across both API
# pods) — NOT to a single node — so no one node's death takes this edge down.
# The other edge (monthly-coral) proxies to its own local API NodePort.
#
# Media (/images/activities/*) is NOT split here — the API itself proxies that
# path to the warmth-media pod (MEDIA_UPSTREAM in k3s/30-api.yaml), so every edge
# serves identical pod media with no per-edge nginx block.
#
# If the warmth-api Service ClusterIP changes (svc recreated), update the upstream
# below to match `kubectl -n warmth get svc warmth-api`.

upstream warmth_api_cluster {
    server 10.43.180.200:80;   # warmth-api Service ClusterIP
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=couple_join:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name warmth-api.dbtvault-solutions.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name warmth-api.dbtvault-solutions.tech;

    ssl_certificate /etc/letsencrypt/live/warmth-api.dbtvault-solutions.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warmth-api.dbtvault-solutions.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location = /couple/join {
        limit_req zone=couple_join burst=5 nodelay;
        proxy_pass http://warmth_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host warmth-api.dbtvault-solutions.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://warmth_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host warmth-api.dbtvault-solutions.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
