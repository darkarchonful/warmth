# Static media (activity card art: <id>.jpg / <id>.mp4). Files are BAKED into the
# warmth-media image (built from api/public/activities via media/Dockerfile), so
# each replica is fully self-contained — NO shared volume. Two replicas spread
# across nodes give active-active HA: either pod/node can die and the other keeps
# serving with zero gap. Reached at /images/activities/* via the API proxy
# (MEDIA_UPSTREAM in k3s/30-api.yaml → this Service's ClusterIP).
#
# Add/replace clips: update files in api/public/activities → rebuild+push
#   docker build -f media/Dockerfile -t ghcr.io/darkarchonful/warmth-media:vN api/public/activities
#   docker push ...:vN  → bump image below → kubectl apply. Batch clips per build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warmth-media
  namespace: warmth
spec:
  replicas: 2
  selector:
    matchLabels: { app: warmth-media }
  template:
    metadata:
      labels: { app: warmth-media }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values: ["primary", "backup"]
        # Spread the two replicas onto different nodes for real HA.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: warmth-media }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: ghcr.io/darkarchonful/warmth-media:v6
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warmth-media
  namespace: warmth
spec:
  type: NodePort
  selector: { app: warmth-media }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
