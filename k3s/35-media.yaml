# Static media (activity card art: <id>.jpg / <id>.mp4). Files are BAKED into the
# warmth-media image (built from api/public/activities via media/Dockerfile), so
# each replica is fully self-contained — NO shared volume. Two replicas spread
# across nodes give active-active HA: either pod/node can die and the other keeps
# serving with zero gap. Reached at /images/activities/* via the API proxy
# (MEDIA_UPSTREAM in k3s/30-api.yaml → this Service's ClusterIP).
#
# Add/replace clips: update files in api/public/activities → rebuild+push
#   docker build -f media/Dockerfile -t ghcr.io/darkarchonful/warmth-media:vN api/public/activities
#   docker push ...:vN  → bump image below → kubectl apply. Batch clips per build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warmth-media
  namespace: warmth
spec:
  replicas: 2
  selector:
    matchLabels: { app: warmth-media }
  template:
    metadata:
      labels: { app: warmth-media }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values: ["primary", "backup"]
      # Same spread rule as warmth-api (30-api.yaml). Replaces the earlier
      # *preferred* podAntiAffinity, which counted OLD pods during a rollout and
      # let both new replicas land on one node (seen 2026-09-22 after coral test).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Ignore tainted (unreachable) nodes so a replacement can still be
          # scheduled on the surviving node during a node outage.
          nodeTaintsPolicy: Honor
          # Count only same-revision pods. Needs k8s 1.30+ (have 1.34).
          matchLabelKeys: ["pod-template-hash"]
          labelSelector:
            matchLabels:
              app: warmth-media
      containers:
        - name: nginx
          image: ghcr.io/darkarchonful/warmth-media:v8
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: warmth-media
  namespace: warmth
spec:
  type: NodePort
  selector: { app: warmth-media }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
